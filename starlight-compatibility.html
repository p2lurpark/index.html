      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px calc(28px + var(--safe-b));
    position:relative;
  }

  h1,h2,h3{
    font-family:'Black Han Sans', 'Noto Sans KR', sans-serif;
    margin:0;
    font-weight:400;
    letter-spacing:-0.01em;
  }
  p{margin:0;}

  .app-header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding: calc(16px + var(--safe-t)) 18px 14px;
    position:relative;
    z-index:2;
  }
  .app-header .mnet-logo{
    grid-column:1;
    justify-self:start;
    height:20px;
    width:auto;
    display:block;
  }
  .app-header .starsignal-logo{
    grid-column:2;
    height:23px;
    width:auto;
    display:block;
  }

  .star-field{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .star-field svg{width:100%; height:100%; display:block;}
  .tw{
    animation-name:twinkle;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    transform-box:fill-box;
    transform-origin:center;
  }
  .tw-star{
    animation-name:twinkle;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(0.75);}
    50%{opacity:1; transform:scale(1.2);}
  }
  .constellation{
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    transform-box:fill-box;
    transform-origin:center;
  }
  .drift1{animation-name:driftA; animation-duration:23s;}
  .drift2{animation-name:driftB; animation-duration:29s;}
  @keyframes driftA{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    50%{transform:translate(7px,-9px) rotate(1.5deg);}
  }
  @keyframes driftB{

  <!-- ============ SCREEN 1: FORM ============ -->
  <div class="screen active" id="screen-form">
    <h1>당신의 별을 알려주세요</h1>
    <p class="subhead">이름과 태어난 정보를 입력하면, 오늘 최애와의 별자리 궁합을 각도로 계산해서 보여드려요.</p>

    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="예: 김민지" autocomplete="name">
    </div>

    <div class="field">
      <label id="genderLabel">성별</label>
      <div class="seg" role="group" aria-labelledby="genderLabel" id="genderSeg">
        <button type="button" class="seg-btn" data-gender="남" aria-pressed="false">남</button>
        <button type="button" class="seg-btn" data-gender="여" aria-pressed="false">여</button>
        <button type="button" class="seg-btn" data-gender="논바이너리" aria-pressed="false">논바이너리</button>
      </div>
    </div>

    <div class="field">
      <label id="birthdateLabel">생년월일</label>
      <div class="row-3" role="group" aria-labelledby="birthdateLabel">
        <select id="birthYear" aria-label="출생 연도"></select>
        <select id="birthMonth" aria-label="출생 월"></select>
        <select id="birthDay" aria-label="출생 일"></select>
      </div>
    </div>

    <div class="field">
      <label for="birthtime">태어난 시간</label>
      <input type="time" id="birthtime">
      <div class="check-row">
        <input type="checkbox" id="timeUnknown">
        <label for="timeUnknown" style="margin:0;"><span style="font-weight:400; color:var(--text-dim);">태어난 시간을 몰라요</span></label>
      </div>
      <p class="hint">시간을 몰라도 궁합은 볼 수 있어요. 다만 상승궁·하우스처럼 시간이 꼭 필요한 정밀 분석은 이번 계산에서는 빠져요.</p>
    </div>

    <div class="field">
      <label>출생지</label>

    "물물":"둘 다 물의 별자리라 말하지 않아도 서로의 기분 변화를 먼저 알아차려요.",
    "불공기":"불과 공기는 서로를 살려주는 조합이에요. 공기가 불에게 방향을 주고, 불은 공기를 데워요.",
    "공기불":"불과 공기는 서로를 살려주는 조합이에요. 공기가 불에게 방향을 주고, 불은 공기를 데워요.",
    "흙물":"흙과 물은 서로를 지탱해 주는 조합이에요. 물이 흙을 촉촉하게 하고, 흙은 물의 형태를 잡아줘요.",
    "물흙":"흙과 물은 서로를 지탱해 주는 조합이에요. 물이 흙을 촉촉하게 하고, 흙은 물의 형태를 잡아줘요."
  };
  function elementRelation(elA, elB){
    if(elA===elB) return {bonus:4, text:ELEMENT_PAIR_TEXT[elA+elB]};
    const key = elA+elB;
    if(ELEMENT_PAIR_TEXT[key]) return {bonus:8, text:ELEMENT_PAIR_TEXT[key]};
    return {bonus:-4, text:`${elA}와 ${elB}는 반응 속도와 우선순위가 달라요. 같은 상황을 서로 다른 온도로 받아들이니, 그 차이를 알고 있는 것만으로도 오해가 줄어요.`};
  }
  function modalityRelation(modA, modB){
    if(modA===modB) return {bonus:-3, text:`둘 다 ${modA}이에요. 같은 방식으로 상황을 주도하려는 순간 부딪힐 수 있어서, 역할을 미리 나눠두면 훨씬 편해져요.`};
    return {bonus:2, text:`${modA}와 ${modB}는 시작·유지·전환 중 서로 다른 역할을 맡고 있어요. 한쪽이 벌이면 한쪽이 다듬는 식으로 손발이 맞는 편이에요.`};
  }

  // ---------- Sun sign from date ----------
  function sunSignIndex(month, day){
    const mmdd = month*100+day;
    if(mmdd>=321 && mmdd<=419) return 0;
    if(mmdd>=420 && mmdd<=520) return 1;
    if(mmdd>=521 && mmdd<=621) return 2;
    if(mmdd>=622 && mmdd<=722) return 3;
    if(mmdd>=723 && mmdd<=822) return 4;
    if(mmdd>=823 && mmdd<=922) return 5;
    if(mmdd>=923 && mmdd<=1022) return 6;
    if(mmdd>=1023 && mmdd<=1122) return 7;
    if(mmdd>=1123 && mmdd<=1221) return 8;
    if(mmdd>=1222 || mmdd<=119) return 9;
    if(mmdd>=120 && mmdd<=218) return 10;
    return 11; // 219~320
  }

  // ---------- Moon sign (저정밀 평균황경 근사식) ----------
  // 기준: J2000.0 (2000-01-01 12:00 UTC), 달의 평균황경 L0 = 218.3164477˚, 평균 운동 13.17639648˚/일
  // 출처 근거: Jean Meeus, "Astronomical Algorithms" 저정밀 항(달의 평균 궤도 요소)
  function getMoonInfo(date){
    const J2000 = Date.UTC(2000,0,1,12,0,0);
    const daysSince = (date.getTime() - J2000) / 86400000;
    let L = 218.3164477 + 13.17639648 * daysSince;
    L = ((L % 360) + 360) % 360;
    return {index: Math.floor(L/30), longitude: L, daysSince: daysSince};
  }

  function circDiff(i, j){
    const d = Math.abs(i-j);
    return Math.min(d, 12-d);
  }

  function moonHarmony(diff){
    if(diff===0 || diff===2 || diff===4) return 3;   // 합·섹스타일·트라인 계열: 우호적
    if(diff===3 || diff===6) return -3;               // 스퀘어·충 계열: 긴장
    return -1;                                          // 세미섹스타일·퀸컹스 계열: 약한 부조화
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function catchphraseFor(score){
    if(score>=100) return {text:"ONLYONE, ONLY YOU", tone:"gold"};
    if(score>=90)  return {text:"초격차 케미, 제대로 통했다!", tone:"gold"};
    if(score>=80)  return {text:"하고잡이와 하고잡이, 제대로 만났다!", tone:"gold"};
    if(score>=70)  return {text:"정열창존으로 완성되는 우리 사이", tone:"gold"};
    return {text:"안 돼도 다시! 아직 가능성은 남아있으니까!", tone:"rose"};
  }

  function verdictFor(score){
    if(score>=94) return {label:"물 흐르듯 잘 통하는 하루", sub:"별다른 설명 없이도 서로의 흐름을 따라가기 좋은 날이에요."};
    if(score>=87) return {label:"편안하고 즐거운 하루", sub:"긴장 없이 대화가 이어지고, 함께 있는 시간이 자연스러워요."};
    if(score>=79) return {label:"설렘과 긴장이 함께 있는 하루", sub:"살짝 부딪히더라도, 그 자극이 오히려 관계를 선명하게 만들어요."};
    if(score>=71) return {label:"조금의 노력이 필요한 하루", sub:"서로 다른 속도를 확인하고 맞춰가려는 마음이 도움이 돼요."};
    return {label:"서로 다른 결을 확인하는 하루", sub:"다름을 틀림으로 읽지 않는 게 오늘의 관건이에요."};
  }

  // ---------- Partner (이선호) ----------
  const PARTNER = {
    name:"이선호",
    gender:"남성",
    month:5, day:30, year:1990,
    timeUnknown:true,
    place:"대한민국 서울"
  };
  const partnerSignIdx = sunSignIndex(PARTNER.month, PARTNER.day);

  // ---------- DOM refs ----------
  const screenForm = document.getElementById('screen-form');
  const screenResult = document.getElementById('screen-result');
  const nameInput = document.getElementById('name');
  const genderSeg = document.getElementById('genderSeg');
  const birthYearSel = document.getElementById('birthYear');
  const birthMonthSel = document.getElementById('birthMonth');
  const birthDaySel = document.getElementById('birthDay');
  const birthtimeInput = document.getElementById('birthtime');
  const timeUnknownCheck = document.getElementById('timeUnknown');
  const countryInput = document.getElementById('birthCountry');
  const cityInput = document.getElementById('birthCity');
  const formError = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  let selectedGender = null;
  genderSeg.querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      genderSeg.querySelectorAll('.seg-btn').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
      selectedGender = btn.dataset.gender;
    });
  });

  timeUnknownCheck.addEventListener('change', ()=>{
    birthtimeInput.disabled = timeUnknownCheck.checked;
    if(timeUnknownCheck.checked) birthtimeInput.value = '';
  });

  // ---------- Year / Month / Day selects ----------
  (function populateDateSelects(){
    const nowY = new Date().getFullYear();
    let yearOpts = '<option value="">연도</option>';
    for(let y=nowY; y>=1900; y--){ yearOpts += `<option value="${y}">${y}</option>`; }
    birthYearSel.innerHTML = yearOpts;

    let monthOpts = '<option value="">월</option>';
    for(let m=1;m<=12;m++){ monthOpts += `<option value="${m}">${m}</option>`; }
    birthMonthSel.innerHTML = monthOpts;

    updateDayOptions();
  })();

  function updateDayOptions(){
    const y = parseInt(birthYearSel.value) || 2000; // 연도 미선택 시 윤년 기준으로 넉넉히 계산
    const m = parseInt(birthMonthSel.value) || 1;
    const daysInMonth = new Date(y, m, 0).getDate();
    const prevVal = birthDaySel.value;
    let dayOpts = '<option value="">일</option>';
    for(let d=1; d<=daysInMonth; d++){ dayOpts += `<option value="${d}">${d}</option>`; }
    birthDaySel.innerHTML = dayOpts;
    if(prevVal && parseInt(prevVal) <= daysInMonth){ birthDaySel.value = prevVal; }
  }
  birthYearSel.addEventListener('change', updateDayOptions);
  birthMonthSel.addEventListener('change', updateDayOptions);

  // ---------- Wheel drawing (static ticks + glyphs) ----------
  const ticksLayer = document.getElementById('ticksLayer');
  const glyphLayer = document.getElementById('glyphLayer');

  function polar(angleDeg, r){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return {x: 150 + r*Math.cos(rad), y: 150 + r*Math.sin(rad)};
  }

  (function drawStaticWheel(){
    let ticks = '';
    let glyphs = '';
    for(let i=0;i<12;i++){
      const a = i*30;
      const p1 = polar(a, 122);
      const p2 = polar(a, 130);
      ticks += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#9DB2D6" stroke-width="1.5"/>`;
      const gp = polar(a+15, 107);
      glyphs += `<text x="${gp.x}" y="${gp.y}" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#4C5E85">${ZODIAC[i].symbol}</text>`;
    }
    ticksLayer.innerHTML = ticks;
    glyphLayer.innerHTML = glyphs;
  })();

  function drawDynamic(userIdx, partnerIdx, moonIdx, tone){
    const dyn = document.getElementById('dynamicLayer');
    const pA = polar(userIdx*30+15, 90);
    const pB = polar(partnerIdx*30+15, 90);
    const pM = polar(moonIdx*30+15, 68);

    const lineColor = tone==='harmonious' ? '#D9A441' : (tone==='tense' ? '#DD7B67' : '#7C8CB0');

    dyn.innerHTML = `
      <line x1="${pA.x}" y1="${pA.y}" x2="${pB.x}" y2="${pB.y}" stroke="${lineColor}" stroke-width="1.6" stroke-dasharray="3 4" opacity="0.85"/>
      <circle cx="${pM.x}" cy="${pM.y}" r="9" fill="none" stroke="#3E63C7" stroke-width="1" opacity="0.55" class="moon-pulse">
        <animate attributeName="r" values="6;10;6" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${pM.x}" cy="${pM.y}" r="4" fill="#3E63C7"/>
      <circle cx="${pA.x}" cy="${pA.y}" r="9" fill="#20304E" stroke="#D9A441" stroke-width="2"/>
      <text x="${pA.x}" y="${pA.y}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#FFE7B8">${ZODIAC[userIdx].symbol}</text>
      <circle cx="${pB.x}" cy="${pB.y}" r="9" fill="#20304E" stroke="#DD7B67" stroke-width="2"/>
      <text x="${pB.x}" y="${pB.y}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#FFD9CE">${ZODIAC[partnerIdx].symbol}</text>
    `;
  }

  // ---------- Submit ----------
  submitBtn.addEventListener('click', ()=>{
    const name = nameInput.value.trim();
    const y = parseInt(birthYearSel.value);
    const m = parseInt(birthMonthSel.value);
    const d = parseInt(birthDaySel.value);

    if(!name){ formError.textContent = '이름을 입력해 주세요.'; nameInput.focus(); return; }
    if(!selectedGender){ formError.textContent = '성별을 선택해 주세요.'; return; }
    if(!y || !m || !d){ formError.textContent = '생년월일을 연도·월·일 모두 선택해 주세요.'; birthYearSel.focus(); return; }
    formError.textContent = '';

    const userSignIdx = sunSignIndex(m, d);
    const signA = ZODIAC[userSignIdx];
    const signB = ZODIAC[partnerSignIdx];

    const cd = circDiff(userSignIdx, partnerSignIdx);
    const aspect = ASPECTS[cd];

    const elRel = elementRelation(signA.element, signB.element);
    const modRel = modalityRelation(signA.modality, signB.modality);

    const today = new Date();
    const moon = getMoonInfo(today);
    const moonSign = ZODIAC[moon.index];
    const diffA = circDiff(moon.index, userSignIdx);
    const diffB = circDiff(moon.index, partnerSignIdx);
    const moonBonus = clamp(moonHarmony(diffA) + moonHarmony(diffB), -8, 8);

    // 오늘의 궁합은 대체로 후하게 나오도록, 서비스 차원의 기본 보정을 더해요.
    const GENEROSITY_BONUS = 22;
    const rawScore = aspect.base + elRel.bonus + modRel.bonus + moonBonus + GENEROSITY_BONUS;
    const score = Math.round(clamp(rawScore, 65, 100));
    const v = verdictFor(score);
    const cp = catchphraseFor(score);
    const cpEl = document.getElementById('catchphrase');
    cpEl.textContent = cp.text;
    cpEl.className = 'catchphrase tone-' + cp.tone;

    // ---- Fill result screen ----
    document.getElementById('resultTitle').innerHTML = `<span class="accent">${name}</span> 님과 이선호 님, 오늘의 궁합`;

    // scoreText / heroScore are animated via animateScoreCount() after the screen becomes visible
    document.getElementById('verdictText').textContent = v.label;
    document.getElementById('verdictSub').textContent = v.sub;

    document.getElementById('chipAName').textContent = name;
    document.getElementById('chipAGlyph').textContent = signA.symbol;
    document.getElementById('chipASign').textContent = signA.name;
    document.getElementById('chipAMeta').innerHTML = `${signA.element} · ${signA.modality}<br>지배행성 ${signA.ruler} · ${signA.range}`;

    document.getElementById('chipBGlyph').textContent = signB.symbol;
    document.getElementById('chipBSign').textContent = signB.name;
    document.getElementById('chipBMeta').innerHTML = `${signB.element} · ${signB.modality}<br>지배행성 ${signB.ruler} · ${signB.range}`;

    document.getElementById('aspectDesc').textContent =
      `${signA.name}와 ${signB.name}는 별자리 원판 위에서 ${cd}칸(${aspect.angle}) 떨어져 있어요. 점성술에서는 이 각도를 '${aspect.name}'이라고 불러요. ` + aspect.desc(signA.name, signB.name);

    document.getElementById('elementDesc').textContent = `원소로 보면— ${elRel.text}`;
    document.getElementById('modalityDesc').textContent = `태도(3특질)로 보면 — ${modRel.text}`;

    const moonDateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
    document.getElementById('moonDesc').textContent =
      `${moonDateStr} 기준, 달은 ${moonSign.name} 부근을 지나고 있어요(평균황경 약 ${moon.longitude.toFixed(1)}°). 달은 하루 평균 13.18˚씩 움직여서 한 별자리에 약 2.3일 머무는데, 오늘의 달은 두 사람의 태양궁과 각각 ${diffA}칸, ${diffB}칸 떨어져 있어요. 이 위치가 감정적인 반응 속도에 영향을 주면서, 오늘 하루의 분위기를 살짝 더하거나 덜어내요.`;

    // breakdown
    const bd = document.getElementById('breakdownList');
    bd.innerHTML = `
      <div class="breakdown-row"><span>기본 점수 <b>(${aspect.name}, ${aspect.angle})</b></span><span class="val">${aspect.base}</span></div>
      <div class="breakdown-row"><span>원소 보정 <b>(${signA.element}·${signB.element})</b></span><span class="val">${elRel.bonus>=0?'+':''}${elRel.bonus}</span></div>
      <div class="breakdown-row"><span>태도 보정 <b>(${signA.modality}·${signB.modality})</b></span><span class="val">${modRel.bonus>=0?'+':''}${modRel.bonus}</span></div>
      <div class="breakdown-row"><span>오늘의 달 보정 <b>(${moonSign.name} 통과)</b></span><span class="val">${moonBonus>=0?'+':''}${moonBonus}</span></div>
      <div class="breakdown-row" style="border-top:1px solid var(--line); padding-top:9px; margin-top:2px;"><span><b>총점</b></span><span class="val" style="font-size:14px;">${score}</span></div>
    `;

    document.getElementById('footnoteText').textContent =
      `이 계산은 태양궁(생일 기준 별자리) 사이의 각도, 4원소·3특질 상성, 그리고 오늘 날짜의 달 위치를 반영한 값이에요. 달 위치는 J2000.0(2000년 1월 1일 12:00 UTC) 기준 평균황경 218.3164477˚에 하루 평균 13.17639648˚를 더하는 근사식으로 구했고, 실제 관측치와 며칠 정도 오차가 있을 수 있어요. 태어난 시간과 좌표를 활용하는 상승궁·하우스 분석은 포함되지 않았어요.`;

    drawDynamic(userSignIdx, partnerSignIdx, moon.index, aspect.tone);

    screenForm.classList.remove('active');
    screenResult.classList.add('active');
    screenResult.scrollTop = 0;
    window.scrollTo({top: 0, behavior: 'instant'});

    setupRevealAnimations();
    animateScoreCount('heroScore', score);
    animateScoreCount('scoreText', score);
  });

  // ---------- Score count-up animation ----------
  function animateScoreCount(elId, target){
    const el = document.getElementById(elId);
    if(!el) return;
    const duration = 1100;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      const val = Math.round(eased * target);
      el.textContent = val;
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  }

  // ---------- Scroll reveal: fade/slide elements in as they enter view, out as they leave ----------
  let revealObserver = null;
  function setupRevealAnimations(){
    const targets = screenResult.querySelectorAll('.reveal');
    targets.forEach(el => el.classList.remove('in-view'));

    if(!revealObserver){
      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting){
            entry.target.classList.add('in-view');
          } else {
            entry.target.classList.remove('in-view');
          }
        });
      }, {threshold:0.12, rootMargin:'0px 0px -6% 0px'});
    }
    requestAnimationFrame(() => {
      targets.forEach(el => revealObserver.observe(el));
    });
  }

  document.getElementById('backBtn').addEventListener('click', goBack);
  document.getElementById('restartBtn').addEventListener('click', goBack);
  function goBack(){
    screenResult.classList.remove('active');
    screenForm.classList.add('active');
  }

})();
</script>
</body>
</html>
